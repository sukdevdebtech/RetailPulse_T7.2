name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
permissions: { contents: read }

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix: { python-version: ["3.10", "3.11", "3.12"] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python-version }}", cache: pip }
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -v
      - name: API smoke test
        run: |
          python -m retailpulse.pipeline
          python - <<'PY'
          from fastapi.testclient import TestClient
          from api.main import app
          c = TestClient(app)
          assert c.get("/health").json()["status"] == "ok"
          assert len(c.get("/forecast?horizon=4").json()["forecast"]) == 4
          assert c.post("/churn/predict", json={"frequency": 1, "monetary": 40}).status_code == 200
          assert c.get("/customers/-5").status_code == 404
          PY
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: { context: ., push: false, tags: "retailpulse:${{ github.sha }}" }
