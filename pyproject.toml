[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retailpulse"
version = "2.0.0"
description = "RetailPulse v2 - AI-powered customer analytics and demand forecasting"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "joblib>=1.3",
]

[project.optional-dependencies]
app = ["streamlit>=1.34", "plotly>=5.18", "fastapi>=0.110", "uvicorn>=0.29"]
mlops = ["mlflow>=2.13", "prophet>=1.1"]
dev = ["pytest>=8.0", "ruff>=0.4", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
